<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Pumpkin radial gradient -->
    <radialGradient id="pumpkinGrad" cx="50%" cy="45%" r="50%" fx="45%" fy="35%">
      <stop offset="0%" stop-color="#FFA233"/>
      <stop offset="45%" stop-color="#FF6B00"/>
      <stop offset="85%" stop-color="#D94B00"/>
      <stop offset="100%" stop-color="#9C2E00"/>
    </radialGradient>
    <!-- Carved inner glow -->
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF8B0"/>
      <stop offset="40%" stop-color="#FFDE38"/>
      <stop offset="80%" stop-color="#FF8A00"/>
      <stop offset="100%" stop-color="#6B1D00"/>
    </radialGradient>
    <!-- Stem gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#558B2F"/>
      <stop offset="50%" stop-color="#33691E"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <!-- Subtle drop shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Green Stem -->
  <path d="M 47,20 C 47,10 55,8 60,6 C 58,11 55,16 52,21 Z" fill="url(#stemGrad)" />

  <!-- Pumpkin Body Lobe - Left Outer -->
  <ellipse cx="32" cy="56" rx="19" ry="29" fill="url(#pumpkinGrad)" filter="url(#shadow)" />
  <!-- Pumpkin Body Lobe - Right Outer -->
  <ellipse cx="68" cy="56" rx="19" ry="29" fill="url(#pumpkinGrad)" filter="url(#shadow)" />
  <!-- Pumpkin Body Lobe - Mid Left -->
  <ellipse cx="40" cy="57" rx="19" ry="31" fill="url(#pumpkinGrad)" />
  <!-- Pumpkin Body Lobe - Mid Right -->
  <ellipse cx="60" cy="57" rx="19" ry="31" fill="url(#pumpkinGrad)" />
  <!-- Pumpkin Center Lobe -->
  <ellipse cx="50" cy="58" rx="18" ry="32" fill="url(#pumpkinGrad)" />

  <!-- Left Carved Eye -->
  <polygon points="34,44 43,49 32,53" fill="url(#glowGrad)" />

  <!-- Right Carved Eye -->
  <polygon points="66,44 57,49 68,53" fill="url(#glowGrad)" />

  <!-- Nose Triangle -->
  <polygon points="50,53 46,59 54,59" fill="url(#glowGrad)" />

  <!-- Spooky Carved Grin / Mouth with Teeth -->
  <path d="M 27,65 
           Q 50,86 73,65 
           L 68,69 
           L 64,65 
           L 60,70 
           L 55,66 
           L 50,71 
           L 45,66 
           L 40,70 
           L 36,65 
           L 32,69 
           Z" 
        fill="url(#glowGrad)" />
</svg>
